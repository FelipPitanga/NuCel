<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NuCel Direct Player</title>
<link rel="stylesheet" href="/ws-scrcpy.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#050406;color:#f7f2fb;font-family:Arial,sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#shell{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#050406;overflow:hidden}
#stream{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stream .device-view{
  width:100%;
  height:100%;
  max-width:100%;
  max-height:100%;
  align-items:stretch;
  justify-content:center!important;
  overflow:hidden
}
#stream .video{
  height:100%;
  width:auto;
  max-width:calc(100% - 44px);
  max-height:100%;
  place-items:center
}
#stream .video-layer,#stream .touch-layer{
  height:100%!important;
  width:auto!important;
  max-width:100%!important;
  max-height:100%!important
}
#stream .control-buttons-list{
  width:44px!important;
  height:100%;
  max-height:100%;
  overflow:hidden!important;
  display:flex!important;
  flex-direction:column;
  justify-content:space-evenly;
  padding:3px 0
}
#stream .control-button,
#stream .control-wrapper>label.control-button{
  width:28px!important;
  height:28px!important;
  min-height:28px!important;
  margin:0 auto!important;
  flex:0 0 28px
}
#stream .control-button>svg{
  width:100%!important;
  height:100%!important
}
#status{position:absolute;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);padding:8px 12px;border-radius:9px;background:#17131fcc;color:#ad9bb9;font-size:11px;white-space:nowrap}
#status.hidden{display:none}
#status.error{color:#fb7185;border:1px solid #fb718555}
</style>
</head>
<body tabindex="0">
<div id="shell">
  <div id="stream"></div>
  <div id="status">conectando…</div>
</div>

<script src="/ws-scrcpy.umd.js"></script>
<script>
(function(){
  const qs=new URLSearchParams(location.search);
  const device=qs.get('device')||'0059410259';
  const status=document.getElementById('status');
  const stream=document.getElementById('stream');

  document.title='NuCel · '+device;

  function focusKeyboard(){
    try{
      window.focus();
      document.body.focus({preventScroll:true});
    }catch{}
  }

  document.addEventListener('pointerdown',focusKeyboard,true);
  document.addEventListener('mousedown',focusKeyboard,true);
  document.addEventListener('touchstart',focusKeyboard,{capture:true,passive:true});

  function fail(message){
    status.textContent=message;
    status.classList.remove('hidden');
    status.classList.add('error');
  }

  if(!window.WsScrcpy){
    fail('biblioteca do player não carregou');
    return;
  }

  const secure=location.protocol==='https:';
  const port=location.port?Number.parseInt(location.port,10):(secure?443:80);

  let handle=null;
  let reconnectTimer=null;
  let reconnectAttempt=0;
  let connectStartedAt=0;
  let stopped=false;
  let generation=0;

  function showStatus(message,isError){
    status.textContent=message;
    status.classList.remove('hidden');
    status.classList.toggle('error',!!isError);
  }

  function cleanupHandle(){
    const old=handle;
    handle=null;
    window.__nucelHandle=null;
    try{old&&old.stop()}catch{}
    try{stream.removeAttribute('data-ws-scrcpy-active')}catch{}
    try{stream.querySelectorAll('.device-view').forEach(function(el){el.remove()})}catch{}
  }

  function scheduleReconnect(reason){
    if(stopped||reconnectTimer)return;
    reconnectAttempt+=1;
    const delay=Math.min(5000,750*Math.pow(2,Math.min(reconnectAttempt-1,3)));
    console.warn('[NuCel] stream caiu:',reason||'sem motivo','- nova tentativa em',delay,'ms');
    showStatus('reconectando…',false);
    reconnectTimer=setTimeout(function(){
      reconnectTimer=null;
      connect();
    },delay);
  }

  function connect(){
    if(stopped)return;

    if(reconnectTimer){
      clearTimeout(reconnectTimer);
      reconnectTimer=null;
    }

    const myGeneration=++generation;
    cleanupHandle();
    connectStartedAt=Date.now();
    showStatus(reconnectAttempt?'reconectando…':'conectando…',false);

    try{
      handle=window.WsScrcpy.startStream(stream,device,{
        host:location.hostname,
        port:port,
        secure:secure,
        codec:'h264',
        bitrate:8000000,
        maxSize:1080,
        maxFps:30,
        audio:false,
        keyboard:true,
        deviceKind:'phone',
        onConnect:function(){
          if(stopped||myGeneration!==generation)return;
          if(reconnectTimer){
            clearTimeout(reconnectTimer);
            reconnectTimer=null;
          }
          reconnectAttempt=0;
          status.classList.add('hidden');
          status.classList.remove('error');
          focusKeyboard();
          console.info('[NuCel] stream conectado:',device);
        },
        onDisconnect:function(reason){
          if(stopped||myGeneration!==generation)return;
          scheduleReconnect(reason||'websocket desconectado');
        },
        onError:function(err){
          if(stopped||myGeneration!==generation)return;
          scheduleReconnect(err&&err.message?err.message:String(err));
        }
      });
      window.__nucelHandle=handle;
    }catch(err){
      if(myGeneration!==generation)return;
      scheduleReconnect(err&&err.message?err.message:String(err));
    }
  }

  const watchdog=setInterval(function(){
    if(stopped||reconnectTimer)return;
    if(handle&&!handle.isConnected&&Date.now()-connectStartedAt>20000){
      scheduleReconnect('conexão travada por mais de 20s');
    }
  },5000);

  window.addEventListener('online',function(){
    if(!stopped&&handle&&!handle.isConnected&&!reconnectTimer){
      scheduleReconnect('rede voltou');
    }
  });

  document.addEventListener('visibilitychange',function(){
    if(!document.hidden&&!stopped&&handle&&!handle.isConnected&&!reconnectTimer){
      scheduleReconnect('aba voltou ao foco');
    }
  });

  connect();

  window.addEventListener('beforeunload',function(){
    stopped=true;
    generation+=1;
    if(reconnectTimer)clearTimeout(reconnectTimer);
    clearInterval(watchdog);
    cleanupHandle();
  });
})();
</script>
</body>
</html>
