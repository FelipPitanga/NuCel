<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NuCel Embed Lab</title>
<style>
html,body{margin:0;min-height:100%;background:#0e0b13;color:#eee;font-family:Arial,sans-serif}
main{max-width:430px;margin:30px auto;padding:20px}
h1{font-size:20px;margin:0 0 8px}
p{color:#a79cac;font-size:13px;line-height:1.5}
.frame{margin-top:18px;background:#050406;border:1px solid #312839;border-radius:14px;overflow:hidden;height:720px}
iframe{width:100%;height:100%;border:0;background:#050406}
</style>
</head>
<body>
<main>
<h1>NuCel · teste de player embutido</h1>
<p>Se o aparelho aparecer e responder aqui, o embed está pronto para entrar no dashboard NuCel.</p>
<div class="frame">
<iframe
  src="http://localhost:8000/embed.html?device=0059410259&codec=h264&maxFps=30&maxSize=720&audio=false&keyboard=true"
  allow="clipboard-read; clipboard-write; fullscreen">
</iframe>
</div>
</main>
</body>
</html>
