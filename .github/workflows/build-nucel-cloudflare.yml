name: Build NuCel Cloudflare

on:
  push:
    branches:
      - nucel-bridge-v2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build-only placeholders. Real values stay in Cloudflare runtime vars/secrets.
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_placeholder
      SUPABASE_SECRET_KEY: sb_secret_build_placeholder
      NUCEL_OWNER_EMAIL: build@example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build OpenNext for Cloudflare
        run: npx opennextjs-cloudflare build

      - name: Package OpenNext output
        run: tar -czf nucel-open-next.tar.gz .open-next wrangler.jsonc

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: nucel-open-next
          path: nucel-open-next.tar.gz
          retention-days: 3
